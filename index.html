
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Um convite especial</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #ffe3ed, #f8d9e8);
    color: #542d43;
}

.card {
    width: 100%;
    max-width: 560px;
    padding: 40px 25px;
    text-align: center;
    background: white;
    border-radius: 25px;
    box-shadow: 0 15px 40px #00000015;
    animation: aparecer 0.5s ease;
}

h1 {
    font-size: 30px;
    line-height: 1.3;
}

p {
    color: #886477;
    margin-bottom: 25px;
    line-height: 1.5;
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.yes, .next {
    background: #d95d91;
    color: white;
}

.yes:hover, .next:hover {
    background: #c94c82;
    transform: translateY(-2px);
}

.no {
    background: #f5e8ee;
    color: #936d80;
    min-width: 88px;
}

.actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    min-height: 60px;
}

.choices {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 25px 0;
}

.time {
    background: #fff0f5;
    color: #9a5577;
    border: 1px solid #f2c9da;
    min-width: 0;
}

.time.selected {
    background: #d95d91;
    color: white;
    border-color: #d95d91;
}

.next:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.hint {
    color: #a16b84;
    margin-bottom: 20px;
    font-size: 14px;
}

.final-image {
    width: 220px;
    max-width: 80%;
    height: auto;
    display: block;
    margin: 0 auto 20px;
    border-radius: 15px;
}

.final h1 {
    color: #c94c82;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 420px) {

    .card {
        padding: 34px 20px;
    }

    .choices {
        grid-template-columns: repeat(2, 1fr);
    }

    h1 {
        font-size: 25px;
    }

}

</style>
</head>

<body>

<main class="card" id="app">

    <h1>
        Sabrína, gostaria de ver Look Back comigo?
    </h1>

    <p>
        Tenho um convite especial para você...
    </p>

    <div class="actions">

        <button class="yes" id="yesBtn">
            Sim!
        </button>

        <button class="no" id="noBtn">
            Não
        </button>

    </div>

</main>

<script>

const app = document.getElementById("app");

let noAttempts = 0;

const noBtn = document.getElementById("noBtn");

function shrinkNo() {

    noAttempts++;

    let scale = Math.max(0.12, 1 - noAttempts * 0.16);

    noBtn.style.transform = `scale(${scale})`;

    noBtn.style.padding =
        `${Math.max(2, 14 - noAttempts * 2)}px
        ${Math.max(3, 28 - noAttempts * 4)}px`;

    noBtn.style.fontSize =
        `${Math.max(5, 16 - noAttempts * 2)}px`;

    noBtn.style.opacity =
        Math.max(0.12, 1 - noAttempts * 0.13);

    if (noAttempts >= 7) {
        noBtn.style.visibility = "hidden";
    }

}

noBtn.addEventListener("pointerenter", shrinkNo);

noBtn.addEventListener("click", shrinkNo);

noBtn.addEventListener("touchstart", shrinkNo, {
    passive: true
});


document.getElementById("yesBtn").addEventListener("click", () => {

    app.innerHTML = `

        <h1>
            Escolha dois horários, caso ocorra algum imprevisto:
        </h1>

        <p>
            Selecione exatamente duas opções.
        </p>

        <div class="choices" id="choices">

            ${["14h", "15h", "16h", "17h",
               "18h", "19h", "20h", "21h"]

            .map(time => `
                <button class="time" data-time="${time}">
                    ${time}
                </button>
            `).join("")}

        </div>

        <div class="hint" id="hint">
            0 de 2 horários escolhidos
        </div>

        <button class="next" id="nextBtn" disabled>
            Próximo
        </button>

    `;

    const selected = new Set();

    const hint = document.getElementById("hint");

    const next = document.getElementById("nextBtn");

    document.querySelectorAll(".time").forEach(button => {

        button.addEventListener("click", () => {

            const time = button.dataset.time;

            if (selected.has(time)) {

                selected.delete(time);

                button.classList.remove("selected");

            } else if (selected.size < 2) {

                selected.add(time);

                button.classList.add("selected");

            }

            hint.textContent =
                `${selected.size} de 2 horários escolhidos`;

            next.disabled = selected.size !== 2;

        });

    });


    next.addEventListener("click", () => {

        if (selected.size !== 2) return;

        app.innerHTML = `

            <div class="final">

                <img
                    src="minion-coracao.jpg"
                    class="final-image"
                    alt="Minion segurando um coração"
                >

                <h1>
                    Cineminha marcado!
                </h1>

                <p>
                    Estarei no seu aguardo.
                </p>

                <p>
                    Horários escolhidos:
                    ${[...selected].join(" e ")}
                </p>

            </div>

        `;

    });

});

</script>

</body>
</html>
